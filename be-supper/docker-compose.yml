version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: be-supper-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forgevault
      MYSQL_USER: forge
      MYSQL_PASSWORD: forge123
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: be-supper-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: forge
      PMA_PASSWORD: forge123
    ports:
      - "8000:80"
    depends_on:
      - mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be-supper-api
    restart: always
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - mysql

volumes:
  mysql_data:
